<mat-toolbar class="barra">
  @if (!navegacaoFixa()) {
    <button matIconButton type="button" aria-label="Abrir menu" (click)="menu.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  @if (barraCompleta()) {
    <span class="titulo">Planilha Financeira</span>
  }
  <span class="espaco"></span>

  <!-- Sem ação até T-016 (F-04 §2). -->
  <button matButton="filled" type="button" class="registrar" aria-label="Registrar gasto">
    @if (!barraCompleta()) {
      <mat-icon>add</mat-icon>
    }
    {{ barraCompleta() ? 'Registrar gasto' : 'Gasto' }}
  </button>
  <button matButton="outlined" type="button" class="registrar" aria-label="Registrar receita">
    @if (!barraCompleta()) {
      <mat-icon>add</mat-icon>
    }
    {{ barraCompleta() ? 'Registrar receita' : 'Receita' }}
  </button>
</mat-toolbar>

<mat-sidenav-container class="corpo">
  <mat-sidenav
    #menu
    class="navegacao"
    [mode]="navegacaoFixa() ? 'side' : 'over'"
    [opened]="navegacaoFixa()"
  >
    <mat-nav-list aria-label="Navegação principal">
      @for (item of itensDeNavegacao; track item.rota) {
        <a
          mat-list-item
          [routerLink]="item.rota"
          [queryParams]="item.comMes ? { mes: mesSelecionado.mes() } : null"
          routerLinkActive="item-ativo"
          [routerLinkActiveOptions]="comparacaoDoAtivo"
          #ativo="routerLinkActive"
          ariaCurrentWhenActive="page"
          [activated]="ativo.isActive"
          (click)="aoEscolherItem(menu)"
        >
          <mat-icon matListItemIcon>{{ item.icone }}</mat-icon>
          <span matListItemTitle>{{ item.rotulo }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-banner-conexao />
    <main class="conteudo">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
